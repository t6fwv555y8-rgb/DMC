<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#100216"><title>Blood Mist — Mobile Demo</title><style>
:root{--pink:#ff2b8d;--cyan:#2de2ff;--orange:#ff831c;--purple:#16031e;--green:#69ff69}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050208;color:white;font-family:system-ui,-apple-system,sans-serif}#app{position:relative;width:100vw;height:100dvh;max-width:520px;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 25%,#45104f,#13031b 58%,#050208)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(24px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 28%,rgba(100,18,112,.65),rgba(5,2,8,.94) 68%)}.hidden{display:none!important}.logo{font:900 clamp(48px,15vw,82px)/.82 Impact,Haettenschweiler,sans-serif;letter-spacing:.03em;color:var(--pink);text-shadow:0 0 12px #ff2b8d,5px 5px 0 #171835;transform:skew(-4deg);text-align:center}.sub{font-weight:900;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase;text-align:center;font-size:12px}.btn{touch-action:manipulation;border:2px solid var(--cyan);background:linear-gradient(#1d2c49,#0a0c18);color:white;font:900 20px Impact,system-ui,sans-serif;letter-spacing:.08em;padding:14px 22px;min-width:190px;clip-path:polygon(8% 0,92% 0,100% 22%,95% 100%,5% 100%,0 22%);text-transform:uppercase}.btn.hot{border-color:var(--pink);background:linear-gradient(#641841,#280916);box-shadow:0 0 18px rgba(255,43,141,.35)}.btn.small{min-width:0;padding:10px 14px;font-size:15px}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.help{max-width:330px;text-align:center;color:#d2c3d7;font-size:13px;line-height:1.35}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(92vw,430px)}.node{aspect-ratio:1.08;border:2px solid var(--cyan);background:linear-gradient(145deg,#1d2945,#0a0712);display:flex;flex-direction:column;align-items:center;justify-content:center;clip-path:polygon(10% 0,90% 0,100% 18%,94% 100%,6% 100%,0 18%);font-weight:900}.node.lock{filter:grayscale(1) brightness(.35)}.node.perfect{border-color:var(--pink);box-shadow:0 0 13px var(--pink)}.stars{color:#ff6eb3;font-size:14px;letter-spacing:.05em}.hud{position:absolute;inset:0;z-index:10;pointer-events:none}.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:3.5%;right:3.5%;display:flex;justify-content:space-between;align-items:flex-start}.pill{background:rgba(5,3,11,.76);border:1px solid var(--cyan);padding:7px 9px;border-radius:4px;font-weight:900;font-size:11px;letter-spacing:.08em}.mist{width:135px;height:16px;border:2px solid var(--pink);background:#160918;overflow:hidden}.mist>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a00850,#ff2b8d,#ff8a2b);box-shadow:0 0 12px #ff2b8d}.shots{display:flex;gap:5px;margin-top:6px}.shot{width:29px;height:29px;border:1px solid #7aeaff;background:#111225;display:grid;place-items:center;font-size:16px}.pause{position:absolute;right:4%;top:max(56px,calc(env(safe-area-inset-top) + 50px));z-index:12;width:44px;height:44px;border:2px solid var(--cyan);background:#0b0913cc;color:white;font-weight:900;font-size:19px}.hint{position:absolute;left:50%;bottom:max(9%,calc(env(safe-area-inset-bottom) + 65px));transform:translateX(-50%);z-index:13;border:2px solid var(--pink);background:#0b0610dd;padding:8px 12px;font-weight:900;font-size:12px;letter-spacing:.12em;animation:p .75s infinite alternate}@keyframes p{to{transform:translateX(-50%) scale(1.06);box-shadow:0 0 16px var(--pink)}}.rating{font-size:54px;letter-spacing:.08em;filter:drop-shadow(0 0 10px var(--pink))}.tiny{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:10px;color:#8f8198;font-size:9px;z-index:40}.toast{position:absolute;top:28%;left:50%;transform:translateX(-50%);z-index:25;font:900 24px Impact,sans-serif;color:#fff;text-shadow:0 0 12px var(--pink);pointer-events:none}
</style></head><body><div id="app"><canvas id="c"></canvas><div id="hud" class="hud hidden"><div class="top"><div><div id="lvl" class="pill">LEVEL 01</div><div id="shots" class="shots"></div></div><div style="margin-right:52px"><div class="pill" style="text-align:center;margin-bottom:5px">BLOOD MIST</div><div class="mist"><i id="mist"></i></div></div></div></div><button id="pause" class="pause hidden">Ⅱ</button><div id="hint" class="hint hidden">TAP TO SPIN</div><div id="toast" class="toast hidden"></div>
<div id="title" class="screen"><div class="logo">BLOOD<br>MIST</div><div class="sub">Kill Machine mobile playtest</div><button class="btn hot" id="play">PLAY LEVEL 1</button><button class="btn small" id="levelBtn">LEVELS</button><div class="help">Keep the phone vertical. Pull the skull DOWN, aim, and release. Break the glowing orange Core.</div></div>
<div id="levels" class="screen hidden"><div class="logo" style="font-size:48px">BLOOD MIST</div><div id="total" class="sub">☠ 0 / 36</div><div id="grid" class="grid"></div><button class="btn small" id="backTitle">BACK</button></div>
<div id="results" class="screen hidden"><div id="resultTitle" class="logo" style="font-size:45px">BLOOD MIST</div><div id="rating" class="rating">☠</div><div class="row"><button class="btn hot" id="next">NEXT</button><button class="btn" id="replay">REPLAY</button><button class="btn" id="toLevels">LEVELS</button></div></div>
<div id="pauseScreen" class="screen hidden"><div class="logo" style="font-size:46px">PAUSED</div><button class="btn hot" id="resume">RESUME</button><button class="btn" id="restart">RESTART</button><button class="btn" id="pauseLevels">LEVELS</button></div><div class="tiny">v0.5 github playtest</div></div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script><script>
(()=>{const M=Matter,{Engine,Render,Runner,Bodies,Body,Composite,Events,Vector}=M;const app=document.querySelector('#app'),canvas=document.querySelector('#c');let W=390,H=844,engine,render,runner,level=1,current,anchor,aim=false,dragId=null,shotIndex=0,shotSeq=[],mist=0,maxMist=100,complete=false,paused=false,particles=[],sawUsed=false,shotStarted=0;const $=s=>document.querySelector(s),screens=['#title','#levels','#results','#pauseScreen'];const SAVE='bloodmist-gh-v1';let save=loadSave();function loadSave(){try{return Object.assign({unlock:1,best:{}},JSON.parse(localStorage.getItem(SAVE)||'{}'))}catch{return{unlock:1,best:{}}}}function persist(){localStorage.setItem(SAVE,JSON.stringify(save))}function show(id){screens.forEach(s=>$(s).classList.add('hidden'));$(id).classList.remove('hidden')}function resize(){W=Math.min(innerWidth,520);H=innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;canvas.style.width=W+'px';canvas.style.height=H+'px';if(render){render.options.width=W;render.options.height=H;render.canvas.width=W*devicePixelRatio;render.canvas.height=H*devicePixelRatio;render.options.pixelRatio=devicePixelRatio}}addEventListener('resize',resize);resize();
const COLORS={bone:'#72e6ff',steel:'#267ea8',flesh:'#ff3f87',core:'#ff7a1a'};function seqFor(n){if(n<3)return['skull','skull','skull'];if(n<5)return['piston','piston','piston'];if(n<8)return['skull','piston','skull'];if(n<10)return['saw','saw','saw'];return n===10?['saw','piston','saw']:['saw','skull','piston','saw']}function env(n){return n>=8?2:1}function rating(){const p=mist/maxMist;return p>=.9?3:p>=.6?2:1}function totalBest(){return Object.values(save.best).reduce((a,b)=>a+(+b||0),0)}function nodeGrid(){const g=$('#grid');g.innerHTML='';for(let i=1;i<=12;i++){let b=save.best[i]||0,d=document.createElement('button');d.className='node'+(i>save.unlock?' lock':'')+(b===3?' perfect':'');d.innerHTML='<div>'+String(i).padStart(2,'0')+'</div><div class="stars">'+('☠'.repeat(b)+'○'.repeat(3-b))+'</div>';if(i<=save.unlock)d.onclick=()=>startLevel(i);g.appendChild(d)}$('#total').textContent='☠ '+totalBest()+' / 36'}
function startLevel(n){level=n;show('#title');$('#title').classList.add('hidden');$('#levels').classList.add('hidden');$('#results').classList.add('hidden');$('#pauseScreen').classList.add('hidden');$('#hud').classList.remove('hidden');$('#pause').classList.remove('hidden');$('#lvl').textContent='LEVEL '+String(n).padStart(2,'0');shotSeq=seqFor(n);shotIndex=0;mist=0;maxMist=100;complete=false;paused=false;particles=[];sawUsed=false;$('#mist').style.width='0%';$('#hint').classList.add('hidden');setupWorld();updateShots();spawnShot()}
function cleanup(){if(render){Render.stop(render);render.canvas.remove();render.textures={}}if(runner)Runner.stop(runner);if(engine)Engine.clear(engine);render=runner=engine=null}
function setupWorld(){cleanup();engine=Engine.create({gravity:{x:0,y:1.05}});render=Render.create({element:app,engine,canvas,options:{width:W,height:H,wireframes:false,background:'transparent',pixelRatio:devicePixelRatio}});runner=Runner.create();Render.run(render);Runner.run(runner,engine);const ground=Bodies.rectangle(W/2,H-12,W,24,{isStatic:true,label:'ground',render:{fillStyle:'#1b0d24'}});Composite.add(engine.world,ground);buildLevel(level);Events.on(engine,'collisionStart',onHit);Events.on(render,'afterRender',drawExtras)}
function block(x,y,w,h,type='bone',staticBody=false,angle=0){const b=Bodies.rectangle(x,y,w,h,{isStatic:staticBody,angle,label:type,friction:.7,restitution:.05,density:type==='steel'?.004:.002,render:{fillStyle:COLORS[type],strokeStyle:type==='steel'?'#54dfff':'#ff77b9',lineWidth:2}});b.hp=type==='steel'?80:type==='flesh'?48:38;b.maxHp=b.hp;b.mistVal=type==='steel'?9:type==='flesh'?13:7;Composite.add(engine.world,b);return b}function core(x,y,r=24){const b=Bodies.circle(x,y,r,{label:'core',density:.003,restitution:.1,render:{fillStyle:COLORS.core,strokeStyle:'#ffd05a',lineWidth:4}});b.hp=65;b.maxHp=65;b.mistVal=35;Composite.add(engine.world,b);return b}
function buildLevel(n){const y0=H*.38,e=env(n);if(e===1){for(let i=0;i<3;i++)block(W*.62+i*32,y0+115,25,150,i===1?'steel':'bone');block(W*.68,y0+35,150,24,'steel');core(W*.68,y0+5,23)}else{for(let i=0;i<3;i++)block(W*.59+i*35,y0+120,22,170,i===1?'flesh':'bone',false,(i-1)*.08);block(W*.67,y0+35,160,20,'flesh');core(W*.67,y0+2,23)}if(n===2||n===4||n===6||n===9||n===11){block(W*.55,y0+35,18,195,n>=8?'flesh':'bone',false,-.3);block(W*.78,y0+10,20,210,'steel',false,.28)}if(n===5||n===7||n===10||n===12){block(W*.48,y0+70,18,170,'bone',false,-.45);block(W*.83,y0+70,18,170,n>=8?'flesh':'steel',false,.45);block(W*.68,y0-35,115,18,'steel')}if(n===12){block(W*.68,y0-95,190,18,'flesh');core(W*.68,y0-62,21)}}
function spawnShot(){if(complete||shotIndex>=shotSeq.length){if(!complete)setTimeout(()=>finish(false),900);return}const type=shotSeq[shotIndex];anchor={x:W*.5,y:H*.82};current=Bodies.circle(anchor.x,anchor.y,type==='piston'?22:20,{isStatic:true,label:'projectile',density:type==='piston'?.009:.004,restitution:.25,render:{fillStyle:type==='piston'?'#2ccfff':type==='saw'?'#ff3e94':'#66eaff',strokeStyle:'#ffffff',lineWidth:3}});current.kind=type;current.fired=false;Composite.add(engine.world,current);sawUsed=false;if(type==='saw'&&level===8)$('#hint').classList.remove('hidden')}
function updateShots(){const box=$('#shots');box.innerHTML='';shotSeq.forEach((s,i)=>{let d=document.createElement('div');d.className='shot';d.style.opacity=i<shotIndex?.25:1;d.textContent=s==='piston'?'✹':s==='saw'?'◉':'☠';box.appendChild(d)})}
function pos(ev){const r=canvas.getBoundingClientRect(),p=ev.touches?ev.touches[0]:ev;return{x:(p.clientX-r.left)*W/r.width,y:(p.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',e=>{if(paused||complete||!current)return;const p=pos(e),d=Math.hypot(p.x-current.position.x,p.y-current.position.y);if(!current.fired&&d<65){aim=true;dragId=e.pointerId;canvas.setPointerCapture?.(e.pointerId);e.preventDefault();return}if(current.fired&&current.kind==='saw'&&!sawUsed){activateSaw();e.preventDefault()}});canvas.addEventListener('pointermove',e=>{if(!aim||e.pointerId!==dragId||!current)return;let p=pos(e),dx=p.x-anchor.x,dy=Math.max(0,p.y-anchor.y),len=Math.hypot(dx,dy),max=120;if(len>max){dx*=max/len;dy*=max/len}Body.setPosition(current,{x:anchor.x+dx,y:anchor.y+dy});e.preventDefault()});canvas.addEventListener('pointerup',e=>{if(!aim||e.pointerId!==dragId||!current)return;aim=false;let dx=anchor.x-current.position.x,dy=anchor.y-current.position.y;Body.setStatic(current,false);Body.setVelocity(current,{x:dx*.12,y:dy*.12});current.fired=true;shotStarted=performance.now();shotIndex++;updateShots();setTimeout(()=>{if(current&&current.fired&&!complete)spawnShot()},2600);e.preventDefault()});function activateSaw(){sawUsed=true;current.sawActive=true;$('#hint').classList.add('hidden');Body.setAngularVelocity(current,.9);toast('SAW ACTIVE')}
function onHit(ev){for(const pair of ev.pairs){let p=pair.bodyA.label==='projectile'?pair.bodyA:pair.bodyB.label==='projectile'?pair.bodyB:null,o=p?(pair.bodyA===p?pair.bodyB:pair.bodyA):null;if(!p||!o||!['bone','steel','flesh','core'].includes(o.label))continue;let speed=p.speed||Vector.magnitude(p.velocity),mul=p.kind==='piston'?2.2:p.kind==='saw'&&p.sawActive?(o.label==='steel'?.45:3.2):1;let dmg=speed*7*mul;if(p.kind==='piston')Body.applyForce(o,o.position,{x:p.velocity.x*.00055,y:p.velocity.y*.00055});damage(o,dmg)}}
function damage(b,d){if(b._dead)return;b.hp-=d;if(b.hp<=0){b._dead=true;mist=Math.min(maxMist,mist+(b.mistVal||5));$('#mist').style.width=(mist/maxMist*100)+'%';burst(b.position.x,b.position.y,b.label==='core'?40:15);Composite.remove(engine.world,b);if(b.label==='core'){complete=true;toast('CORE DESTROYED');setTimeout(()=>finish(true),1100)}}else if(b.label==='core')burst(b.position.x,b.position.y,4)}function burst(x,y,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5-1,life:40+Math.random()*35,r:2+Math.random()*5})}
function drawExtras(){const ctx=render.context;ctx.save();for(const b of Composite.allBodies(engine.world)){if(b.label==='core'&&!b._dead){ctx.beginPath();ctx.arc(b.position.x,b.position.y,8+Math.sin(performance.now()/180)*2,0,Math.PI*2);ctx.fillStyle='#fff2a8';ctx.fill();ctx.shadowBlur=22;ctx.shadowColor='#ff4b16';ctx.strokeStyle='#ffbd42';ctx.lineWidth=3;ctx.stroke();ctx.shadowBlur=0}else if(b.label==='projectile'){ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);ctx.fillStyle='#070811';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff8b22';ctx.beginPath();ctx.arc(5,-3,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';for(let i=-1;i<=1;i++)ctx.fillRect(-9+i*6,6,4,7);if(b.kind==='piston'){ctx.strokeStyle='#ff8b22';ctx.lineWidth=5;ctx.strokeRect(-20,-5,15,10)}if(b.kind==='saw'){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-1,0,14,0,Math.PI*2);ctx.stroke();for(let a=0;a<6.28;a+=.52){ctx.beginPath();ctx.moveTo(Math.cos(a)*14,Math.sin(a)*14);ctx.lineTo(Math.cos(a)*20,Math.sin(a)*20);ctx.stroke()}}ctx.restore()}}
if(aim&&current){let vx=(anchor.x-current.position.x)*.12,vy=(anchor.y-current.position.y)*.12;ctx.fillStyle='#ff7fc0';for(let i=1;i<=11;i++){let t=i*.11,x=current.position.x+vx*t*5,y=current.position.y+vy*t*5+.5*1.05*(t*5)*(t*5);ctx.beginPath();ctx.arc(x,y,Math.max(2,5-i*.25),0,Math.PI*2);ctx.fill()}}
for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.05;q.life--;ctx.globalAlpha=Math.max(0,q.life/70);ctx.fillStyle=i%2?'#ff2b8d':'#ff6b38';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();if(q.life<=0)particles.splice(i,1)}ctx.globalAlpha=1;ctx.restore()}
function finish(win){if($('#results').classList.contains('hidden')===false)return;$('#hud').classList.add('hidden');$('#pause').classList.add('hidden');let r=win?rating():1;if(win){save.best[level]=Math.max(save.best[level]||0,r);save.unlock=Math.max(save.unlock,Math.min(12,level+1));persist()}$('#rating').textContent='☠'.repeat(r)+'○'.repeat(3-r);$('#resultTitle').textContent=win?(level===12?'MEATWORKS COMPLETE':'BLOOD MIST'):'TRY AGAIN';$('#next').style.display=win&&level<12?'inline-block':'none';show('#results')}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.add('hidden'),700)}
$('#play').onclick=()=>startLevel(1);$('#levelBtn').onclick=()=>{nodeGrid();show('#levels')};$('#backTitle').onclick=()=>show('#title');$('#toLevels').onclick=$('#pauseLevels').onclick=()=>{cleanup();$('#hud').classList.add('hidden');$('#pause').classList.add('hidden');nodeGrid();show('#levels')};$('#next').onclick=()=>startLevel(level+1);$('#replay').onclick=$('#restart').onclick=()=>startLevel(level);$('#pause').onclick=()=>{if(!engine)return;paused=true;engine.timing.timeScale=0;show('#pauseScreen')};$('#resume').onclick=()=>{show('#title');$('#title').classList.add('hidden');$('#pauseScreen').classList.add('hidden');$('#hud').classList.remove('hidden');$('#pause').classList.remove('hidden');engine.timing.timeScale=1;paused=false};document.addEventListener('visibilitychange',()=>{if(document.hidden&&engine&&!paused&&!complete){paused=true;engine.timing.timeScale=0;show('#pauseScreen')}});nodeGrid();})();
</script></body></html>
